apply plugin: 'com.android.application'

// Número de versión: lo pone el workflow (kozmos/apk/README.md). versionCode crece con cada commit de main.
def versionCodigo = (System.getenv("KOZMOS_VERSION_CODE") ?: "1") as int
def versionNombre = System.getenv("KOZMOS_VERSION_NAME") ?: "k-dev"
// La firma de verdad: el workflow de versión descifra el almacén y pasa su ruta y su clave. Nunca va al repo.
def almacen = System.getenv("KOZMOS_ALMACEN")
def almacenClave = System.getenv("KOZMOS_ALMACEN_CLAVE")

android {
    namespace = "ar.kozmos"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        // ar.kozmos es permanente: cambiarlo es otra app (no se actualiza encima y pierde los datos)
        applicationId "ar.kozmos"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode versionCodigo
        versionName versionNombre
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        // la clave de depuración de la APK de prueba: la del workflow (se guarda entre corridas) o la de esta máquina
        if (System.getenv("KOZMOS_DEPURACION")) {
            debug {
                storeFile file(System.getenv("KOZMOS_DEPURACION"))
                storePassword "android"
                keyAlias "androiddebugkey"
                keyPassword "android"
            }
        }
        if (almacen) {
            kozmos {
                storeFile file(almacen)
                storePassword almacenClave
                storeType "pkcs12"
                keyAlias "kozmos"
                keyPassword almacenClave
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            if (almacen) signingConfig signingConfigs.kozmos
        }
        // La de prueba: igual a la de verdad, pero se instala al lado («Kozmos prueba», ar.kozmos.prueba)
        // y va firmada con la clave de depuración. Nunca pisa la app ni los datos de la de verdad.
        prueba {
            initWith release
            applicationIdSuffix ".prueba"
            versionNameSuffix "-prueba"
            signingConfig signingConfigs.debug
            matchingFallbacks = ['release']
        }
    }
}

// Sin firma de verdad, la APK de versión no se arma: mejor un error claro que una APK que no se puede instalar encima.
gradle.taskGraph.whenReady { g ->
    if (!almacen && g.allTasks.any { it.name == 'assembleRelease' || it.name == 'bundleRelease' }) {
        throw new GradleException("Falta la firma de Kozmos (KOZMOS_ALMACEN). La versión solo se arma en el workflow «Kozmos · versión». Ver kozmos/apk/README.md.")
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'
